<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta name="app-build" content="43" />
    <title>إدارة مشاريع شركة البهجة</title>
    <link rel="manifest" href="manifest.webmanifest?v=6" />
    <link rel="icon" href="logo.jpg" type="image/jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=43" />
  </head>
  <body>
    <div id="app" class="app-shell"></div>
    <script>
      if (navigator.serviceWorker) {
        navigator.serviceWorker.getRegistrations().then(function (list) {
          list.forEach(function (r) { r.unregister(); });
        });
      }
      if (window.caches) {
        caches.keys().then(function (keys) {
          keys.forEach(function (k) { caches.delete(k); });
        });
      }
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="app-config.js?v=43"></script>
    <script src="env.js?v=43"></script>
    <script src="drive.js?v=43"></script>
    <script src="app.js?v=43"></script>
  </body>
</html>
